[project]
site_name = "👋 Hi, I’m Johnny"
site_url = "https://johnnygreco.dev/"
site_description = "Johnny Greco — applied machine learning scientist and writer."
site_author = "Johnny Greco"
site_dir = "site"
extra_css = ["stylesheets/site-v4.css"]
nav = [
  { "Home" = "index.md" },
  { "Activity" = "activity.md" },
  { "Writing" = "writing/index.md" },
  { "Projects" = "projects/index.md" },
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
favicon = "favicon.svg"
language = "en"
font = false
features = [
  "navigation.indexes",
  "navigation.top",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Use dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Use light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/johnnygreco"
name = "Johnny Greco on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://linkedin.com/in/johnnygreco"
name = "Johnny Greco on LinkedIn"

[[project.extra.social]]
icon = "fontawesome/solid/graduation-cap"
link = "https://scholar.google.com/citations?user=CDWpgoAAAAAJ"
name = "Johnny Greco on Google Scholar"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:jgreco.ai@gmail.com"
name = "Email Johnny Greco"

[project.extra]
generator = false

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
pymdownx.magiclink = {}
pymdownx.superfences = {}
zensical.extensions.macros = {
  include_yaml = ["data/writing.yml", "data/activity.yml", "data/projects.yml"],
  on_error_fail = true,
  on_undefined = "strict",
}
